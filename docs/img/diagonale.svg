<text class="mut" x="98" y="90" text-anchor="end">↓</text>
<text class="acc t" x="868.0" y="121.8">diagonale = stessa ripresa</text>
<text class="mut" x="868.0" y="138.8">offset girato − film costante</text>
<text class="mut" x="868.0" y="154.8">(±1 s), buchi fino a 3 s</text>
<text class="acc t" x="868.0" y="234.2">stesso shot, altro offset</text>
<text class="mut" x="868.0" y="251.2">il montaggio ricuce il ciak</text>
