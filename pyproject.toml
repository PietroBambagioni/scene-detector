[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-detector"
version = "0.1.0"
description = "Suddivide un film in clip (scene) via TransNetV2 (primario) + PySceneDetect (baseline/split)."
requires-python = ">=3.10"
dependencies = [
    "scenedetect>=0.7",   # opencv-python e' dep base in 0.7
    "numpy>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
neural = ["torch>=2.1", "pillow>=10.0", "einops>=0.7"]   # inference TransNetV2 / AutoShot
asr = ["faster-whisper>=1.0"]                            # trascrizione dialoghi
vlm = ["mlx-vlm>=0.1,<0.7", "pillow>=10.0"]              # VLM per shot (Apple Silicon); <0.7: firma generate() testata (0.6.x)
faces = ["insightface>=1.0", "onnxruntime>=1.20"]        # riconoscimento personaggi (SCRFD+ArcFace, CoreML)
obs = ["psutil>=5.9"]                                    # telemetria run (CPU%/RSS live)
dev = ["pytest>=8.0"]
all = ["scene-detector[neural,asr,vlm,faces,obs]"]       # tutto ciò che serve a `--all`

[project.scripts]
scene-detector = "scene_detector.cli:main"
scene-detector-index = "scene_detector.cli:main_index"
scene-detector-setup = "scene_detector.cli:main_setup"
scene-detector-benchmark = "scene_detector.cli:main_benchmark"

[tool.setuptools.packages.find]
include = ["scene_detector*"]
