[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-detector"
version = "0.1.0"
description = "Suddivide un film in clip (scene) via TransNetV2 (primario) + PySceneDetect (baseline/split)."
requires-python = ">=3.10"
dependencies = [
    "scenedetect>=0.7",   # opencv-python e' dep base in 0.7
    "numpy>=1.24",
    "typer>=0.12",
    "tqdm>=4.66",         # progress bar di decode/inference/split/asr/vlm/faces
]

[project.optional-dependencies]
neural = ["torch>=2.1", "pillow>=10.0"]                  # inference TransNetV2
asr = ["faster-whisper>=1.0"]                            # trascrizione dialoghi
vlm = ["mlx-vlm>=0.1,<0.7", "pillow>=10.0"]              # VLM per shot (Apple Silicon); <0.7: firma generate() testata (0.6.x)
faces = ["insightface>=1.0", "onnxruntime>=1.20"]        # riconoscimento personaggi (SCRFD+ArcFace, CoreML)
obs = ["psutil>=5.9"]                                    # telemetria run (CPU%/RSS live)
dev = ["pytest>=8.0"]
all = ["scene-detector[neural,asr,vlm,faces,obs]"]       # tutto ciò che serve a `--all`

[project.scripts]
# gli oggetti Typer sono callable: nessun wrapper `main_*` in mezzo
scene-detector = "scene_detector.cli:app"
scene-detector-index = "scene_detector.cli:index_app"
scene-detector-setup = "scene_detector.cli:setup_app"
scene-detector-benchmark = "scene_detector.cli:bench_app"

[tool.setuptools.packages.find]
include = ["scene_detector*"]
